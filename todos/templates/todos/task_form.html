{% extends "base.html" %}

{% block title %}{{ action }} Task{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ action }} Task</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_title">Title</label>
            <input type="text" name="title" id="id_title" class="form-control" 
                   value="{{ form.title.value|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="id_description">Description</label>
            <textarea name="description" id="id_description" class="form-control" rows="3">{{ form.description.value|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label for="id_priority">Priority</label>
            <select name="priority" id="id_priority" class="form-select">
                <option value="low" {% if form.priority.value == 'low' %}selected{% endif %}>Low</option>
                <option value="medium" {% if form.priority.value == 'medium' %}selected{% endif %}>Medium</option>
                <option value="high" {% if form.priority.value == 'high' %}selected{% endif %}>High</option>
            </select>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'todos:task_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
